[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "jobagent"
version = "0.1.0"
description = "AI-powered job hunting agent for scraping, matching, applying, and notifying."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "JobAgent Contributors" }
]
keywords = ["jobs", "automation", "llm", "playwright", "openclaw"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries"
]
dependencies = [
  "playwright>=1.50.0",
  "langchain>=1.3.16,<2.0.0",
  "httpx>=0.28.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "click>=8.1.8",
  "PyYAML>=6.0.2",
  "curl-cffi==0.15.0",
  "loguru>=0.7.3",
  "openpyxl>=3.1.5",
  "requests>=2.32.3",
  "retry>=0.9.2",
  "pyrate-limiter>=4.4.0,<5.0.0",
  "langgraph>=1.2.11,<2.0.0",
  "deepagents>=0.7.8,<0.8.0",
  "rich>=15.0.0,<16.0.0",
  "langchain-openai>=1.6.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
  "qrcode>=8.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "ruff>=0.9.7",
  "mypy>=1.15.0",
  "types-pyyaml>=6.0.12.20260815,<7.0.0.0",
]

[project.urls]
Homepage = "https://github.com/VPC-byte/jobagent"
Repository = "https://github.com/VPC-byte/jobagent"
Issues = "https://github.com/VPC-byte/jobagent/issues"

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt 文本常量含不可重排的长中文行（重排会改变字符串字节）。
"jobagent/prompts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = false
check_untyped_defs = true
