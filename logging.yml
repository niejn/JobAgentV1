version: 1
disable_existing_loggers: false
formatters:
  structured:
    (): jobagent.observability.StructuredFormatter
handlers:
  rotating_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: structured
    filename: data/logs/jobagent.log
    maxBytes: 1048576
    backupCount: 7
    encoding: utf-8
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: structured
loggers:
  jobagent:
    level: INFO
    handlers: [rotating_file, console]
    propagate: false
root:
  level: WARNING
  handlers: [console]
